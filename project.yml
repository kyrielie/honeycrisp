# Regenerate Honeycrisp.xcodeproj from this file with:
#   xcodegen generate
#
# The Xcode project is generated output. Keep target settings, package
# dependencies, document registration, and the shared scheme here.

name: Honeycrisp

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  # SPIKE (roadmap M6, decision R5): test target only, not linked into the app. Pinned to a tag whose
  # manifest was read (swift-tools-version:6.0); needs a Swift 6 toolchain.
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3

targets:
  Honeycrisp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - EPUBReader.entitlements
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/EPUBReader.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        ENABLE_FILE_ACCESS_DOWNLOADS_FOLDER: readonly
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Honeycrisp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Honeycrisp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.noliaphyta.Honeycrisp
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.9"
    entitlements:
      path: Sources/EPUBReader.entitlements
      properties:
        com.apple.security.files.bookmarks.app-scope: true

  HoneycrispTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HoneycrispTests
    dependencies:
      - target: Honeycrisp
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.noliaphyta.HoneycrispTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Honeycrisp.app/Contents/MacOS/Honeycrisp"

schemes:
  Honeycrisp:
    build:
      targets:
        Honeycrisp: all
        HoneycrispTests: [test]
    test:
      config: Debug
      targets:
        - HoneycrispTests
    run:
      config: Debug
    archive:
      config: Release
