name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build Release
        # See build-dmg.yml for why CONFIGURATION_BUILD_DIR is used instead of
        # -derivedDataPath: the latter requires -scheme, and no shared scheme is
        # committed to this project.
        run: |
          xcodebuild \
            -project Honeycrisp.xcodeproj \
            -target Honeycrisp \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find build/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "${{ steps.locate.outputs.app_path }}"

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R "${{ steps.locate.outputs.app_path }}" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Honeycrisp" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            Honeycrisp.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: Honeycrisp.dmg
