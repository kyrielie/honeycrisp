name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        # The shared Honeycrisp scheme is generated from project.yml.
        run: |
          xcodebuild \
            -project Honeycrisp.xcodeproj \
            -scheme Honeycrisp \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build/Build/Products/Release" -maxdepth 1 -name "*.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "${{ steps.locate.outputs.app_path }}"

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R "${{ steps.locate.outputs.app_path }}" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Honeycrisp" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            Honeycrisp.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: Honeycrisp.dmg

      - name: Normalize release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Request tap cask update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_UPDATE_TOKEN }}
          repository: kyrielie/homebrew-yggdrasil
          event-type: app-release
          client-payload: '{"app":"honeycrisp","version":"${{ steps.release.outputs.version }}","asset_name":"Honeycrisp.dmg","asset_url":"https://github.com/kyrielie/honeycrisp/releases/download/v${{ steps.release.outputs.version }}/Honeycrisp.dmg"}'
